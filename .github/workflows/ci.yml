# Checks every push and pull request. Read-only: this workflow can't change the repository.
name: CI

on:
  push:
    branches: [main, desktop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  LINUX_DEPS: libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev

jobs:
  web:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check npm dependencies for known vulnerabilities
        run: npm audit --audit-level=moderate

  rust:
    name: Storage tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      # The Rust crate embeds the built frontend, so it has to exist before compiling.
      - run: npm ci && npm run build
      - name: Rust tests (atomic saves, validation, backups) on this OS
        working-directory: src-tauri
        run: cargo test --locked
      - name: Clippy
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

  rust-audit:
    name: Rust dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo install cargo-audit --locked
      - working-directory: src-tauri
        run: cargo audit

  e2e:
    name: End-to-end (real app, Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS webkit2gtk-driver xvfb
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build --debug --no-bundle
      - run: cargo install tauri-driver --locked
      - run: pip install selenium==4.51.0
      - name: Drive the app
        run: |
          xvfb-run --auto-servernum bash -c '
            tauri-driver --native-driver /usr/bin/WebKitWebDriver & sleep 3
            python3 e2e/run.py'

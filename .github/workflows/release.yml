# Builds the macOS and Windows installers.
#
# Pushing a tag like v2.2.0 builds both, then creates a DRAFT release with the installers,
# SHA256SUMS.txt and notes from CHANGELOG.md. Nothing is public until you open the draft
# on GitHub and press Publish.
#
# "Run workflow" on the Actions tab builds both installers as downloadable artifacts
# without creating any release, to test the build first.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri_args: --target universal-apple-darwin --bundles app,dmg
            output: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows x64
            os: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            tauri_args: --bundles nsis
            output: src-tauri/target/release/bundle/nsis/*-setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Tag must match package.json version
        if: github.ref_type == 'tag'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          [ "$TAG" = "v$version" ] || { echo "Tag $TAG does not match package.json version $version"; exit 1; }
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.rust_targets }} && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}-release
      - run: npm ci
      - run: npm test
      - run: npx tauri build ${{ matrix.tauri_args }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.output }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the only job allowed to write, and only to create the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true
      - name: Checksums
        working-directory: installers
        run: sha256sum * | tee SHA256SUMS.txt
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '$0 ~ "^## " v "( |$)" {f=1; next} /^## / {if (f) exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no '## $version' section"; exit 1; }
          printf '\n---\n\n**Download:** `.dmg` for Mac, `-setup.exe` for Windows. First time? See [INSTALL.md](https://github.com/%s/blob/%s/INSTALL.md); your computer will warn you because the app isn'"'"'t signed.\n\nChecksums are in `SHA256SUMS.txt`.\n' "$GITHUB_REPOSITORY" "$TAG" >> notes.md
          cat notes.md
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" installers/* --draft --verify-tag --title "Lexicon ${TAG#v}" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
